name: Unix profiles

on:
  push:
    paths:
      - 'scripts/unix/**'
      - 'scripts/linux/**'
      - 'scripts/macos/**'
      - 'tests/unix/**'
      - '.github/workflows/unix-profiles.yml'
  pull_request:
    paths:
      - 'scripts/unix/**'
      - 'scripts/linux/**'
      - 'scripts/macos/**'
      - 'tests/unix/**'
      - '.github/workflows/unix-profiles.yml'

jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Run profile inheritance checks
        run: bash tests/unix/profile-inheritance.test.sh
